services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: true
    command: start-dev --import-realm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./app/platform/plates/auth_plates/keycloak/settings.json:/opt/keycloak/data/import/realm.json

  keycloak-prod:
    image: quay.io/keycloak/keycloak:latest
    profiles: [prod]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: true
    command: start --optimized --import-realm
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./app/platform/plates/auth_plates/keycloak/settings.json:/opt/keycloak/data/import/realm.json

volumes:
  keycloak_data:
